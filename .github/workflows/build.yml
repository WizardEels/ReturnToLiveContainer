name: Build tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: beerpiss/theos-action@v1
        with:
          # The default cache path (/usr/local/opt) no longer exists on
          # GitHub's macOS runners. runner.temp is always writable.
          cache-dir-theos: ${{ runner.temp }}/theos-cache
          cache-dir-sdks: ${{ runner.temp }}/theos-sdks-cache

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ReturnToLiveContainer.deb
          path: packages/*.deb

      - name: Upload tweak dylib
        uses: actions/upload-artifact@v4
        with:
          name: ReturnToLiveContainer.dylib
          path: .theos/_/Library/MobileSubstrate/DynamicLibraries/ReturnToLiveContainer.dylib
          if-no-files-found: error
